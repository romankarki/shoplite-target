# Every pull request gets its own ShopLite stack (web + api + db) at https://pr-<number>.<host>,
# rebuilt on each push to the PR and removed when the PR is closed. The link is posted as a PR comment.
name: PR preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    # forks don't get secrets; previews are for branches in this repo (e.g. the ones Sidekick opens)
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Build or remove the preview on Akamai Cloud
        id: deploy
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          PREVIEW_DOMAIN: ${{ secrets.PREVIEW_DOMAIN }}
          PR: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          ACTION: ${{ github.event.action }}
        run: |
          if [ -z "$KEY" ]; then echo "::warning::DEPLOY_SSH_KEY not set, skipping preview"; exit 0; fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          if [ "$ACTION" = "closed" ]; then
            ssh -o BatchMode=yes deploy@"$HOST" preview down "$PR"
          else
            ssh -o BatchMode=yes deploy@"$HOST" preview up "$PR" "$BRANCH"
            echo "url=https://pr-$PR.$PREVIEW_DOMAIN" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment the preview link
        if: steps.deploy.outputs.url != ''
        uses: actions/github-script@v7
        env:
          URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const marker = "<!-- shoplite-preview -->";
            const body = `${marker}\n🔍 **Preview:** ${process.env.URL}\n\nBuilt from \`${context.payload.pull_request.head.sha.slice(0, 7)}\` · updates on every push · removed when the PR closes.`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = comments.find(c => c.body && c.body.includes(marker));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
