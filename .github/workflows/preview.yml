# Every pull request gets its own ShopLite stack (web + api + db) on Akamai LKE (Kubernetes), in namespace pr-<number>,
# at https://pr-<number>.<PREVIEW_DOMAIN>. Images are built here and pushed to ghcr.io (tagged with the commit SHA);
# the VM's deploy gate applies the PR branch's k8s manifests. Rebuilt on every push, deleted when the PR closes.
# At most 5 previews run at once (the gate refuses more); Sidekick's dashboard has a kill switch to delete them.
name: PR preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: read
  packages: write
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io/${{ github.repository }}
  SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  preview:
    # forks don't get secrets; previews are for branches in this repo (e.g. the ones Sidekick opens)
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push images (db, api, web)
        run: |
          for svc in db api web; do
            docker build -q -t "$REGISTRY/$svc:$SHA" "./$svc"
            docker push -q "$REGISTRY/$svc:$SHA"
          done

      - name: Deploy to LKE through the deploy gate
        id: deploy
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          PREVIEW_DOMAIN: ${{ secrets.PREVIEW_DOMAIN }}
          PR: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ -z "$KEY" ]; then echo "::warning::DEPLOY_SSH_KEY not set, skipping preview"; exit 0; fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          set +e
          out="$(ssh -o BatchMode=yes deploy@"$HOST" kpreview up "$PR" "$SHA" "$BRANCH")"; code=$?
          set -e
          echo "$out"
          if [ "$code" = 3 ]; then  # flood guard: too many previews running
            { echo "limited=true"; echo "message<<EOF"; echo "$out"; echo "EOF"; } >> "$GITHUB_OUTPUT"; exit 0
          fi
          [ "$code" = 0 ] || exit "$code"
          echo "url=https://pr-$PR.$PREVIEW_DOMAIN" >> "$GITHUB_OUTPUT"

      - name: Comment the preview link
        if: steps.deploy.outputs.url != '' || steps.deploy.outputs.limited == 'true'
        uses: actions/github-script@v7
        env:
          URL: ${{ steps.deploy.outputs.url }}
          LIMITED: ${{ steps.deploy.outputs.message }}
        with:
          script: |
            const marker = "<!-- shoplite-preview -->";
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const body = process.env.URL
              ? `${marker}\n🔍 **Preview on Akamai LKE:** ${process.env.URL}\n\nNamespace \`pr-${context.payload.pull_request.number}\` · built from \`${sha}\` · updates on every push · deleted when the PR closes.`
              : `${marker}\n⏸️ **No preview for \`${sha}\`:** ${process.env.LIMITED}`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = comments.find(c => c.body && c.body.includes(marker));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });

  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Delete the LKE preview
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$KEY" ]; then exit 0; fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -o BatchMode=yes deploy@"$HOST" kpreview down "$PR"
