# ShopLite: web (nginx + static UI) → api (FastAPI) → db (Postgres)
#
#   docker compose up -d --build                      → http://localhost:8080
#
# Branch previews run the same file under a different project name + port, so every branch gets
# its own containers, network and database volume (see scripts/preview.sh):
#   COMPOSE_PROJECT_NAME=shoplite-pr-142 WEB_PORT=8142 PREVIEW_LABEL=pr-142 docker compose up -d --build

services:
  db:
    build: ./db
    environment:
      POSTGRES_DB: shoplite
      POSTGRES_USER: shoplite
      POSTGRES_PASSWORD: ${DB_PASSWORD:-shoplite}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shoplite -d shoplite"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql://shoplite:${DB_PASSWORD:-shoplite}@db:5432/shoplite
      APP_VERSION: ${APP_VERSION:-dev}
      GIT_BRANCH: ${GIT_BRANCH:-main}
      PREVIEW_LABEL: ${PREVIEW_LABEL:-}
      FEEDBACK_WEBHOOK_URL: ${FEEDBACK_WEBHOOK_URL:-}
      FEATURES: ${FEATURES:-wishlist}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./web
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  dbdata:
