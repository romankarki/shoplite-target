apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels: { app.kubernetes.io/name: shoplite, app.kubernetes.io/component: api }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: shoplite, app.kubernetes.io/component: api }
  template:
    metadata:
      labels: { app.kubernetes.io/name: shoplite, app.kubernetes.io/component: api }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: api
          image: shoplite-api
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8000 }]
          envFrom: [{ configMapRef: { name: shoplite-config } }]
          env:
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: shoplite-db, key: password } }
            - name: DATABASE_URL
              value: postgresql://shoplite:$(DB_PASSWORD)@db:5432/shoplite
          readinessProbe:
            httpGet: { path: /api/health, port: 8000 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /api/health, port: 8000 }
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector: { app.kubernetes.io/name: shoplite, app.kubernetes.io/component: api }
  ports: [{ port: 8000, targetPort: 8000 }]
