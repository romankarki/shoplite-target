apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels: { app.kubernetes.io/name: shoplite, app.kubernetes.io/component: web }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: shoplite, app.kubernetes.io/component: web }
  template:
    metadata:
      labels: { app.kubernetes.io/name: shoplite, app.kubernetes.io/component: web }
    spec:
      containers:
        - name: web
          image: shoplite-web
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 80 }]
          readinessProbe:
            httpGet: { path: /, port: 80 }
            periodSeconds: 5
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 128Mi }
---
# ClusterIP by default; expose with `kubectl port-forward svc/web` locally,
# or put an Ingress / LoadBalancer (and Akamai) in front on EKS.
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector: { app.kubernetes.io/name: shoplite, app.kubernetes.io/component: web }
  ports: [{ port: 80, targetPort: 80 }]
