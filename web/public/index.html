<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ShopLite</title>
<link rel="stylesheet" href="/styles.css">
<script>try { const t = localStorage.getItem("shoplite-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>
<body>
<div class="preview-bar" id="preview-bar" hidden></div>

<header class="head"><div class="in">
  <a class="logo" href="/">Shop<span>Lite</span></a>
  <input class="input search" id="search" placeholder="Search products…" autocomplete="off">
  <span class="spacer"></span>
  <button class="btn ghost" id="orders-btn">Orders</button>
  <button class="btn" id="cart-btn">🛒 Cart <span class="badge brand" id="cart-count">0</span></button>
  <button class="icon-btn" id="theme-btn" title="Toggle light / dark">◐</button>
</div></header>

<main class="wrap">
  <section class="hero">
    <span><span class="badge bad">Flash sale</span></span>
    <h1>Everyday gear, up to 30% off</h1>
    <p class="dim" style="margin:0">Free delivery on every order, today only!</p>
  </section>
  <div class="grid" id="grid"></div>
  <div class="footer" id="footer"></div>
</main>

<button class="btn primary fab" id="report-btn">💬 Report a problem / request a feature</button>

<div class="overlay" id="overlay" hidden></div>

<aside class="drawer" id="cart-drawer" hidden>
  <div class="h"><h3>Your cart</h3><button class="icon-btn" data-close>✕</button></div>
  <div class="b" id="cart-lines"></div>
  <div class="f">
    <div class="total"><span class="dim">Total</span><b id="cart-total">$0.00</b></div>
    <form id="checkout-form" style="display:grid;gap:10px">
      <label class="field">Email for the receipt<input class="input" type="email" id="email" required placeholder="you@example.com"></label>
      <div id="checkout-msg"></div>
      <button class="btn primary" id="checkout-btn" type="submit">Checkout</button>
    </form>
  </div>
</aside>

<aside class="drawer" id="orders-drawer" hidden>
  <div class="h"><h3>Your orders</h3><button class="icon-btn" data-close>✕</button></div>
  <div class="b" id="orders-list"></div>
</aside>

<div class="modal" id="report-modal" hidden>
  <div class="card">
    <div class="h"><h3>Tell us what's wrong</h3><button class="icon-btn" data-close>✕</button></div>
    <form class="b" id="report-form">
      <label class="field">Type
        <select class="input" id="r-kind"><option value="bug">Something's broken / slow</option><option value="feature">Feature request</option></select>
      </label>
      <label class="field">What happened?
        <textarea class="input" id="r-text" rows="3" required minlength="3" placeholder="e.g. Checkout takes forever this morning"></textarea>
      </label>
      <div id="r-msg"></div>
      <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" type="button" data-close>Cancel</button><button class="btn primary" type="submit">Submit</button></div>
    </form>
  </div>
</div>

<script src="/app.js"></script>
<script src="/features.js"></script>
</body>
</html>
