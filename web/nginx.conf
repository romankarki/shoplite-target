server {
  listen 80;
  listen [::]:80;
  server_name _;
  root /usr/share/nginx/html;

  # static frontend
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
  location ~* \.(css|js)$ {
    add_header Cache-Control "public, max-age=300";
  }

  # Prometheus metrics from the api (read by Sidekick / Prometheus). Fine for local demos — restrict in production.
  location = /metrics {
    proxy_pass http://api:8000/metrics;
  }

  # API → backend container ("api" resolves via Docker Compose network / Kubernetes Service)
  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }
}
